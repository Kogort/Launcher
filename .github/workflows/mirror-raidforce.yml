name: Mirror RAIDFORCE pack

# D-087: GitHub mirror of the current RAIDFORCE pack.
# - stable content-addressed file store `raidforce-files`: one asset per sha256,
#   only the current index's files are kept; old blobs are deleted after the
#   pointer switches;
# - versioned release `raidforce-<version>`: index, current.json, pack.json, zip;
# - stable pointer mirror/pack.json in the `mirror` branch (atomic git commit);
# - the publisher saves the signed manifest in the mirror-pending branch, so a
#   scheduled run can finish a signed mirror after a failed dispatch.
#
# The publisher triggers this workflow before switching CMS current.json and
# waits for mirror/pack.json. A 5-minute schedule is the reconciliation net.
# Legacy publishers still emit per-version file URLs; the workflow keeps a
# versioned mode during the transition.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pack version (empty: take CMS current.json)"
        required: false
        type: string
      index_url:
        description: "Already uploaded CMS index URL"
        required: false
        type: string
      index_sha:
        description: "sha256 of index bytes"
        required: false
        type: string
      sequence:
        description: "Pointer sequence"
        required: false
        type: string
      published_at:
        description: "ISO publishedAt"
        required: false
        type: string
      mirror_pack:
        description: "Base64 of the signed mirror manifest skeleton (publisher)"
        required: false
        type: string
      dry_run:
        description: "Build and verify only; do not upload/commit/delete"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mirror-raidforce
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACK_SLUG: raidforce
      CMS_BASE: https://cms.kogort.online/wp-content/uploads/kogort/pack
      STORE_TAG: raidforce-files
      PENDING_BRANCH: mirror-pending
      PENDING_FILE: pending-pack.json
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      INPUT_INDEX_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.index_url || '' }}
      INPUT_INDEX_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.index_sha || '' }}
      INPUT_SEQUENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.sequence || '' }}
      INPUT_PUBLISHED_AT: ${{ github.event_name == 'workflow_dispatch' && inputs.published_at || '' }}
      INPUT_MIRROR_PACK: ${{ github.event_name == 'workflow_dispatch' && inputs.mirror_pack || '' }}

    steps:
      - name: Resolve target version
        run: |
          set -euo pipefail
          mkdir -p work
          cd work

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="$INPUT_VERSION"
            INDEX_URL="$INPUT_INDEX_URL"
            INDEX_SHA="$INPUT_INDEX_SHA"
            SEQUENCE="$INPUT_SEQUENCE"
            PUBLISHED_AT="$INPUT_PUBLISHED_AT"
          else
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Cache-Control: no-cache" \
              "$CMS_BASE/$PACK_SLUG/current.json?t=$(date +%s)" \
              -o current.json
            jq -e . current.json >/dev/null
            VERSION="$(jq -r '.version // empty' current.json)"
            INDEX_REL="$(jq -r '.index // .manifest // empty' current.json)"
            INDEX_SHA="$(jq -r '.sha256 // empty' current.json)"
            SEQUENCE="$(jq -r '.sequence // 0' current.json)"
            PUBLISHED_AT="$(jq -r '.publishedAt // empty' current.json)"
            if [[ "$INDEX_REL" == https://* ]]; then
              INDEX_URL="$INDEX_REL"
            else
              INDEX_URL="$CMS_BASE/$PACK_SLUG/$INDEX_REL"
            fi
          fi

          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Bad version: $VERSION"; exit 1; }
          [[ "$INDEX_SHA" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Bad index sha"; exit 1; }
          INDEX_SHA="$(printf '%s' "$INDEX_SHA" | tr 'A-F' 'a-f')"
          [[ "$INDEX_URL" == https://* ]] || { echo "Bad index URL"; exit 1; }
          [[ "$SEQUENCE" =~ ^[0-9]+$ ]] || { echo "Bad sequence"; exit 1; }
          [[ -n "$PUBLISHED_AT" ]] || PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          TAG="raidforce-$VERSION"
          {
            echo "VERSION=$VERSION"
            echo "INDEX_SHA=$INDEX_SHA"
            echo "INDEX_URL=$INDEX_URL"
            echo "SEQUENCE=$SEQUENCE"
            echo "PUBLISHED_AT=$PUBLISHED_AT"
            echo "TAG=$TAG"
            echo "ZIP=raidforce-$VERSION.zip"
            echo "INDEX_ASSET=index-$VERSION.json"
            echo "STORE_BASE=https://github.com/$GH_REPO/releases/download/$STORE_TAG"
            echo "VERSION_BASE=https://github.com/$GH_REPO/releases/download/$TAG"
          } >> "$GITHUB_ENV"

          # D-087: the publisher passes the signed manifest directly. A scheduled
          # run gets it from the mirror-pending branch (pending-pack.json) below.
          if [[ -n "${INPUT_MIRROR_PACK}" ]]; then
            echo "MIRROR_PACK=$INPUT_MIRROR_PACK" >> "$GITHUB_ENV"
          fi

      - name: Resolve signed manifest
        run: |
          set -euo pipefail
          cd work

          if [[ -n "${MIRROR_PACK:-}" ]]; then
            echo "Signed manifest provided by the publisher"
            exit 0
          fi

          PENDING=""
          if PENDING_B64=$(gh api "repos/$GH_REPO/contents/$PENDING_FILE?ref=$PENDING_BRANCH" \
              --jq '.content' 2>/dev/null); then
            PENDING=$(printf '%s' "$PENDING_B64" | base64 -d)
          fi

          if [[ -z "$PENDING" ]]; then
            echo "No pending signed manifest; continuing without it"
            exit 0
          fi

          if ! jq -e . <<<"$PENDING" >/dev/null 2>&1; then
            echo "Pending manifest is not valid JSON; ignoring"
            exit 0
          fi

          P_VERSION="$(jq -r '.version // empty' <<<"$PENDING")"
          P_SHA="$(jq -r '.index_sha256 // empty' <<<"$PENDING")"
          P_SEQUENCE="$(jq -r '.sequence // empty' <<<"$PENDING")"

          if [[ "$P_VERSION" == "$VERSION" \
             && "$P_SHA" == "$INDEX_SHA" \
             && "$P_SEQUENCE" == "$SEQUENCE" ]]; then
            B64="$(printf '%s' "$PENDING" | base64 | tr -d '\n')"
            echo "MIRROR_PACK=$B64" >> "$GITHUB_ENV"
            echo "Using pending signed manifest for $VERSION (sequence=$SEQUENCE)"
          else
            echo "Pending manifest does not match CMS current" \
                 "(version=$P_VERSION sha=$P_SHA sequence=$P_SEQUENCE)"
          fi

      - name: Fetch and verify index
        id: index
        run: |
          set -euo pipefail
          cd work

          curl -fsSL --retry 3 --retry-delay 2 \
            -H "Cache-Control: no-cache" \
            "$INDEX_URL" -o index.json
          echo "$INDEX_SHA  index.json" | sha256sum -c -
          jq -e . index.json >/dev/null

          # D-087: every file must have a URL in the content-addressed store.
          # A signed run must not rewrite the index (index_sha256 is signed).
          # Legacy publishers still emit per-version file URLs; accept that
          # shape during the transition and keep the old upload path.
          MISSING_STORE="$(jq --arg base "$STORE_BASE" \
            '[.files[] | (.sha256) as $sha | select((.urls | index($base + "/" + $sha)) == null)] | length' \
            index.json)"
          MISSING_VERSION="$(jq --arg base "$VERSION_BASE" \
            '[.files[] | (.sha256) as $sha | select((.urls | index($base + "/" + $sha)) == null)] | length' \
            index.json)"

          if [[ "$MISSING_STORE" -eq 0 ]]; then
            MODE=store
            GITHUB_INDEX_SHA="$INDEX_SHA"
            echo "Index mode: content-addressed store"
          elif [[ "$MISSING_VERSION" -eq 0 ]]; then
            MODE=version
            GITHUB_INDEX_SHA="$INDEX_SHA"
            echo "Index mode: legacy per-version assets (transition)"
          else
            if [[ -n "${MIRROR_PACK:-}" ]]; then
              echo "Signed run: $MISSING_STORE file(s) have no store URL and" \
                   "$MISSING_VERSION have no versioned URL; publisher must add GitHub URLs" >&2
              exit 1
            fi

            jq --arg base "$STORE_BASE" '
              .files |= map(
                . as $file
                | ($base + "/" + $file.sha256) as $github
                | if ($file.urls | index($github)) then $file
                  else $file + {urls: ($file.urls + [$github])}
                  end
              )
            ' index.json > index-github.json
            mv index-github.json index.json
            MODE=store
            GITHUB_INDEX_SHA="$(sha256sum index.json | cut -d' ' -f1)"
            echo "Index mode: content-addressed store (URLs added by workflow)"
          fi

          echo "GITHUB_INDEX_SHA=$GITHUB_INDEX_SHA" >> "$GITHUB_ENV"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          COUNT="$(jq '.files | length' index.json)"
          [[ "$COUNT" -gt 0 ]] || { echo "Empty pack index"; exit 1; }
          echo "FILE_COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Read remote pointer
        id: remote
        run: |
          set -euo pipefail
          cd work

          REMOTE_VERSION=""
          REMOTE_SIGNED="false"
          REMOTE_URL="repos/$GH_REPO/contents/pack.json?ref=mirror"

          if REMOTE_B64=$(gh api "$REMOTE_URL" --jq '.content' 2>/dev/null); then
            printf '%s' "$REMOTE_B64" | base64 -d > remote-pack.json
            REMOTE_VERSION="$(jq -r '.version // empty' remote-pack.json)"
            REMOTE_SIGNED="$(jq -r 'if (.signature // "") | length > 0 then "true" else "false" end' remote-pack.json)"
          else
            # Missing pointer is fine; an API failure must not be mistaken for
            # an unsigned mirror and overwrite a signed one.
            set +e
            gh api "$REMOTE_URL" >/dev/null 2>remote-error.txt
            RC=$?
            set -e
            if [[ "$RC" -ne 0 ]] && ! grep -q 'HTTP 404' remote-error.txt; then
              echo "Cannot read mirror pointer:" >&2
              cat remote-error.txt >&2
              exit 1
            fi
          fi

          {
            echo "REMOTE_VERSION=$REMOTE_VERSION"
            echo "REMOTE_SIGNED=$REMOTE_SIGNED"
          } >> "$GITHUB_ENV"
          echo "version=$REMOTE_VERSION" >> "$GITHUB_OUTPUT"
          echo "signed=$REMOTE_SIGNED" >> "$GITHUB_OUTPUT"
          echo "Remote mirror: version=${REMOTE_VERSION:-none}, signed=$REMOTE_SIGNED"

      - name: Decide mirror action
        id: check
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION}" ]]; then
            if [[ "${REMOTE_SIGNED}" == "true" \
               && -z "${MIRROR_PACK:-}" \
               && "${DRY_RUN}" != "true" ]]; then
              echo "Signed mirror requires mirror_pack; refusing an unsigned manual update" >&2
              exit 1
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "assets_only=false" >> "$GITHUB_OUTPUT"
            echo "Pointer update: manual/publisher run"
            exit 0
          fi

          # D-078/D-087: a signed mirror may only be advanced by a matching
          # publisher-signed manifest. Without it, repair assets but keep the
          # pointer untouched.
          if [[ "${REMOTE_SIGNED}" == "true" && -z "${MIRROR_PACK:-}" ]]; then
            echo "Signed mirror without matching manifest: assets only, pointer stays"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "assets_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${REMOTE_VERSION}" == "$VERSION" ]]; then
            echo "Already current: $VERSION"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "assets_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "Needs mirror: remote=${REMOTE_VERSION:-none} local=$VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "assets_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync current file store
        if: steps.index.outputs.mode == 'store'
        run: |
          set -euo pipefail
          cd work
          mkdir -p store

          jq -r '.files[].sha256' index.json | tr 'A-F' 'a-f' | sort -u > shas.txt
          TARGET_COUNT="$(wc -l < shas.txt)"

          STORE_EXISTS=false
          if gh release view "$STORE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            STORE_EXISTS=true
          elif [[ "$DRY_RUN" != "true" ]]; then
            gh release create "$STORE_TAG" -R "$GH_REPO" \
              --title "RAIDFORCE files" \
              --notes "Machine-managed content-addressed store of the current RAIDFORCE pack (D-087). Only files from the current index are kept; do not edit manually." \
              --latest=false
            STORE_EXISTS=true
          fi

          if [[ "$STORE_EXISTS" == "true" ]]; then
            gh api "repos/$GH_REPO/releases/tags/$STORE_TAG" --jq '.id' > store-id.txt
            if [[ "$(gh api "repos/$GH_REPO/releases/$(cat store-id.txt)" --jq '.immutable // false')" == "true" ]]; then
              echo "Store release is immutable; release immutability must be disabled" >&2
              exit 1
            fi
            gh api "repos/$GH_REPO/releases/$(cat store-id.txt)/assets?per_page=100" \
              --paginate --jq '.[].name' | sort -u > store-assets.txt
          else
            : > store-assets.txt
          fi

          comm -23 shas.txt store-assets.txt > missing.txt || true
          MISSING_COUNT="$(wc -l < missing.txt)"
          PRESENT_COUNT="$(comm -12 shas.txt store-assets.txt | wc -l)"
          echo "Store: target=$TARGET_COUNT, present=$PRESENT_COUNT, missing=$MISSING_COUNT"
          echo "STORE_MISSING=$MISSING_COUNT" >> "$GITHUB_ENV"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY_RUN: store sync skipped (missing=$MISSING_COUNT)"
            exit 0
          fi

          if [[ "$MISSING_COUNT" -gt 0 ]]; then
            jq -r '.files[] | [.sha256, (.size|tostring), (.urls|join(" "))] | @tsv' index.json |
            while IFS=$'\t' read -r sha size urls; do
              [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Bad sha: $sha"; exit 1; }
              sha="$(printf '%s' "$sha" | tr 'A-F' 'a-f')"
              [[ "$size" =~ ^[0-9]+$ ]] || { echo "Bad size: $sha"; exit 1; }
              if ! grep -qxF "$sha" missing.txt; then
                continue
              fi
              if [[ -f "store/$sha" ]]; then
                continue
              fi

              ok=false
              for url in $urls; do
                [[ "$url" == https://* ]] || continue
                if curl -fsSL --retry 2 --retry-delay 2 "$url" -o "store/$sha"; then
                  actual_sha="$(sha256sum "store/$sha" | cut -d' ' -f1)"
                  actual_size="$(stat -c%s "store/$sha")"
                  if [[ "$actual_sha" == "$sha" && "$actual_size" == "$size" ]]; then
                    ok=true
                    break
                  fi
                  echo "Bad bytes for $sha from $url (sha=$actual_sha size=$actual_size)"
                fi
              done
              [[ "$ok" == "true" ]] || { echo "All sources failed for $sha"; exit 1; }
            done

            gh release upload "$STORE_TAG" store/* -R "$GH_REPO" || {
              echo "Store upload failed; retrying still-missing assets"
              gh api "repos/$GH_REPO/releases/tags/$STORE_TAG" --jq '.id' > store-id.txt
              gh api "repos/$GH_REPO/releases/$(cat store-id.txt)/assets?per_page=100" \
                --paginate --jq '.[].name' | sort -u > store-assets.txt
              comm -23 shas.txt store-assets.txt > still-missing.txt || true
              args=()
              while IFS= read -r sha; do
                if [[ -f "store/$sha" ]]; then
                  args+=("store/$sha")
                fi
              done < still-missing.txt
              if [[ ${#args[@]} -gt 0 ]]; then
                gh release upload "$STORE_TAG" "${args[@]}" -R "$GH_REPO"
              fi
            }
          fi

          gh api "repos/$GH_REPO/releases/tags/$STORE_TAG" --jq '.id' > store-id.txt
          gh api "repos/$GH_REPO/releases/$(cat store-id.txt)/assets?per_page=100" \
            --paginate --jq '.[].name' | sort -u > store-assets.txt
          comm -23 shas.txt store-assets.txt > still-missing.txt || true
          if [[ -s still-missing.txt ]]; then
            echo "Store is incomplete after upload:" >&2
            cat still-missing.txt >&2
            exit 1
          fi
          echo "Store complete: $TARGET_COUNT file(s)"

      - name: Download pack files
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd work
          mkdir -p staging

          jq -r '.files[] | [.path, .sha256, (.size|tostring), (.urls|join(" "))] | @tsv' index.json |
          while IFS=$'\t' read -r path sha size urls; do
            [[ -n "$path" && "$path" != /* && "$path" != *"\\"* && "$path" != *".."* ]] || {
              echo "Unsafe path: $path"; exit 1;
            }
            [[ "$path" != *$'\t'* && "$path" != *$'\n'* ]] || {
              echo "Control character in path: $path"; exit 1;
            }
            [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Bad sha: $path"; exit 1; }
            sha="$(printf '%s' "$sha" | tr 'A-F' 'a-f')"
            [[ "$size" =~ ^[0-9]+$ ]] || { echo "Bad size: $path"; exit 1; }

            mkdir -p "staging/$(dirname "$path")"
            if [[ -f "store/$sha" ]]; then
              cp "store/$sha" "staging/$path"
              actual_sha="$(sha256sum "staging/$path" | cut -d' ' -f1)"
              actual_size="$(stat -c%s "staging/$path")"
              if [[ "$actual_sha" == "$sha" && "$actual_size" == "$size" ]]; then
                continue
              fi
              echo "Bad store bytes for $path; downloading"
              rm -f "staging/$path"
            fi

            ok=false
            for url in $urls; do
              [[ "$url" == https://* ]] || continue
              if curl -fsSL --retry 2 --retry-delay 2 "$url" -o "staging/$path"; then
                actual_sha="$(sha256sum "staging/$path" | cut -d' ' -f1)"
                actual_size="$(stat -c%s "staging/$path")"
                if [[ "$actual_sha" == "$sha" && "$actual_size" == "$size" ]]; then
                  ok=true
                  break
                fi
                echo "Bad bytes from $url for $path (sha=$actual_sha size=$actual_size); trying next"
              fi
            done
            [[ "$ok" == "true" ]] || { echo "All sources failed: $path"; exit 1; }
          done

      - name: Build zip
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd work

          python3 - <<'PY'
          import os
          import shutil
          import zipfile

          root = "staging"
          out = os.environ["ZIP"]
          entries = []
          for base, _, names in os.walk(root):
              for name in names:
                  full = os.path.join(base, name)
                  rel = os.path.relpath(full, root).replace(os.sep, "/")
                  entries.append((rel, full))
          entries.sort()

          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for rel, full in entries:
                  info = zipfile.ZipInfo.from_file(full, rel)
                  info.date_time = (1980, 1, 1, 0, 0, 0)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  with open(full, "rb") as src, archive.open(info, "w") as dst:
                      shutil.copyfileobj(src, dst)
          print(f"{out}: {len(entries)} files")
          PY

          unzip -t "$ZIP" >/dev/null
          ZIP_SHA="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          ZIP_SIZE="$(stat -c%s "$ZIP")"
          echo "ZIP_SHA=$ZIP_SHA" >> "$GITHUB_ENV"
          echo "ZIP_SIZE=$ZIP_SIZE" >> "$GITHUB_ENV"

      - name: Build pointer and manifest
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd work

          TAG_BASE="https://github.com/$GH_REPO/releases/download/$TAG"
          INDEX_ASSET_URL="$TAG_BASE/$INDEX_ASSET"
          ZIP_URL="$TAG_BASE/$ZIP"
          POINTER_URL="$TAG_BASE/current.json"

          jq -n \
            --arg version "$VERSION" \
            --arg index "$INDEX_ASSET_URL" \
            --arg sha256 "$GITHUB_INDEX_SHA" \
            --argjson sequence "$SEQUENCE" \
            --arg publishedAt "$PUBLISHED_AT" \
            '{version:$version,index:$index,sha256:$sha256,sequence:$sequence,publishedAt:$publishedAt}' \
            > current.json

          if [[ -n "${MIRROR_PACK:-}" ]]; then
            # D-078: publisher signed version/index/index_sha256/sequence/publishedAt.
            # url, sha256 (zip) and size are added after signing and are not
            # part of the signature payload.
            echo "$MIRROR_PACK" | base64 -d > pack-base.json
            jq -e . pack-base.json >/dev/null
            [[ "$(jq -r '.version' pack-base.json)" == "$VERSION" ]] || {
              echo "Signed manifest version mismatch"; exit 1; }
            [[ "$(jq -r '.sequence' pack-base.json)" == "$SEQUENCE" ]] || {
              echo "Signed manifest sequence mismatch"; exit 1; }
            [[ "$(jq -r '.index_sha256' pack-base.json)" == "$GITHUB_INDEX_SHA" ]] || {
              echo "Signed index sha does not match GitHub index"; exit 1; }
            jq --arg url "$ZIP_URL" --arg sha256 "$ZIP_SHA" --argjson size "$ZIP_SIZE" \
              '. + {url:$url, sha256:$sha256, size:$size}' \
              pack-base.json > pack.json
          else
            jq -n \
              --arg version "$VERSION" \
              --arg url "$ZIP_URL" \
              --arg sha256 "$ZIP_SHA" \
              --argjson size "$ZIP_SIZE" \
              --argjson sequence "$SEQUENCE" \
              --arg publishedAt "$PUBLISHED_AT" \
              --arg index "$POINTER_URL" \
              '{version:$version,url:$url,sha256:$sha256,size:$size,sequence:$sequence,publishedAt:$publishedAt,index:$index}' \
              > pack.json
          fi

          cp index.json "$INDEX_ASSET"

      - name: Upload release
        if: steps.check.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          MODE="${{ steps.index.outputs.mode }}"
          cd work
          mkdir -p artifacts

          # Legacy mode: the index points to per-version assets, so they must be
          # uploaded into the versioned release. Store mode keeps blobs in the
          # stable store and publishes only metadata + zip here.
          if [[ "$MODE" == "version" ]]; then
            jq -r '.files[].sha256' index.json | tr 'A-F' 'a-f' | sort -u | while read -r sha; do
              path="$(jq -r --arg sha "$sha" \
                '.files[] | select((.sha256|ascii_downcase)==$sha) | .path' \
                index.json | head -n1)"
              cp "staging/$path" "artifacts/$sha"
            done
          fi

          cp "$INDEX_ASSET" artifacts/
          cp current.json artifacts/
          cp pack.json artifacts/
          cp "$ZIP" artifacts/

          if gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$GH_REPO" --yes
          fi

          gh release create "$TAG" artifacts/* \
            -R "$GH_REPO" \
            --title "RAIDFORCE $VERSION" \
            --notes "Pack mirror for $VERSION (D-087). Current pointer: mirror/pack.json." \
            --draft

          # The stable file store must not be the repository's "Latest" release.
          gh release edit "$TAG" -R "$GH_REPO" --draft=false
          gh release edit "$TAG" -R "$GH_REPO" --latest \
            || echo "Warning: could not mark $TAG as latest"

      - name: Verify published assets
        if: steps.check.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          cd work

          TAG_BASE="https://github.com/$GH_REPO/releases/download/$TAG"
          for attempt in $(seq 1 20); do
            if curl -fsSL --retry 2 "$TAG_BASE/current.json" -o live-current.json \
               && curl -fsSL --retry 2 "$TAG_BASE/pack.json" -o live-pack.json; then
              [[ "$(jq -r '.version' live-current.json)" == "$VERSION" ]] || { sleep 3; continue; }
              [[ "$(jq -r '.sha256' live-current.json)" == "$GITHUB_INDEX_SHA" ]] || { echo "Pointer sha mismatch"; exit 1; }
              [[ "$(jq -r '.sha256' live-pack.json)" == "$ZIP_SHA" ]] || { echo "Manifest zip sha mismatch"; exit 1; }
              INDEX_URL_LIVE="$(jq -r '.index' live-current.json)"
              curl -fsSL --retry 2 "$INDEX_URL_LIVE" -o live-index.json
              echo "$GITHUB_INDEX_SHA  live-index.json" | sha256sum -c -
              echo "Release assets verified"
              exit 0
            fi
            echo "Release assets are not visible yet (attempt $attempt/20)"
            sleep 3
          done
          echo "Release assets did not become visible"
          exit 1

      - name: Commit stable pointer
        if: steps.check.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          cd work

          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" repo
          cd repo
          git config user.name "kogort-mirror"
          git config user.email "mirror@users.noreply.github.com"

          git fetch --depth 1 origin mirror || true
          if git show-ref --verify --quiet refs/remotes/origin/mirror; then
            git checkout -B mirror origin/mirror
          else
            git checkout --orphan mirror
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # The launcher publisher writes mirror/launcher.json (fallback
          # update manifest). Do not delete it with the pack pointer cleanup.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'launcher.json' -exec rm -rf {} +
          cp ../pack.json .
          git add pack.json
          git commit -m "mirror: $VERSION"
          git push --force origin mirror

      - name: Prune file store to current index
        if: steps.index.outputs.mode == 'store' && env.DRY_RUN != 'true' && (steps.check.outputs.skip != 'true' || steps.check.outputs.assets_only == 'false')
        run: |
          set -euo pipefail
          cd work

          jq -r '.files[].sha256' index.json | tr 'A-F' 'a-f' | sort -u > keep.txt
          gh api "repos/$GH_REPO/releases/tags/$STORE_TAG" --jq '.id' > store-id.txt
          gh api "repos/$GH_REPO/releases/$(cat store-id.txt)/assets?per_page=100" \
            --paginate --jq '.[] | [.id, .name] | @tsv' > store-assets.tsv

          removed=0
          while IFS=$'\t' read -r id name; do
            if [[ ! "$name" =~ ^[0-9a-f]{64}$ ]]; then
              continue
            fi
            if ! grep -qxF "$name" keep.txt; then
              if gh api --method DELETE "repos/$GH_REPO/releases/assets/$id" >/dev/null; then
                removed=$((removed + 1))
              else
                echo "Failed to delete old store asset: $name"
              fi
            fi
          done < store-assets.tsv

          echo "Pruned $removed old file(s); store now matches $VERSION"
          echo "STORE_PRUNED=$removed" >> "$GITHUB_ENV"

          gh api "repos/$GH_REPO/releases/$(cat store-id.txt)/assets?per_page=100" \
            --paginate --jq '.[].name' | sort -u > remaining.txt
          comm -23 keep.txt remaining.txt > store-broken.txt || true
          if [[ -s store-broken.txt ]]; then
            echo "Store lost current files after pruning:" >&2
            cat store-broken.txt >&2
            exit 1
          fi

      - name: Update legacy <=1.2.2 release
        if: steps.check.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          cd work

          LEGACY_TAG="raidforce-modpack"
          if ! gh release view "$LEGACY_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "Legacy release $LEGACY_TAG is missing; skipping"
            exit 0
          fi

          mkdir -p legacy
          cp "$ZIP" "legacy/raidforce-$VERSION.zip"
          jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/$GH_REPO/releases/download/$LEGACY_TAG/raidforce-$VERSION.zip" \
            --arg sha256 "$ZIP_SHA" \
            --argjson size "$ZIP_SIZE" \
            --argjson sequence "$SEQUENCE" \
            --arg publishedAt "$PUBLISHED_AT" \
            '{version:$version,url:$url,sha256:$sha256,size:$size,sequence:$sequence,publishedAt:$publishedAt}' \
            > legacy/pack.json

          gh release upload "$LEGACY_TAG" \
            "legacy/raidforce-$VERSION.zip" "legacy/pack.json" \
            -R "$GH_REPO" --clobber || {
              echo "Legacy release update failed; new mirror is already current"; exit 0;
            }

          OLD="$(gh release view "$LEGACY_TAG" -R "$GH_REPO" --json assets \
            --jq '.assets[].name' \
            | grep -E '^raidforce-.*\.zip$' \
            | grep -vxF "raidforce-$VERSION.zip" || true)"
          if [[ -n "$OLD" ]]; then
            while IFS= read -r old; do
              gh release delete-asset "$LEGACY_TAG" "$old" -R "$GH_REPO" --yes || true
            done <<< "$OLD"
          fi

      - name: Delete older versions
        if: steps.check.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          OLD="$(gh release list -R "$GH_REPO" --limit 100 --json tagName \
            --jq '.[].tagName' \
            | grep -E '^raidforce-20[0-9]' \
            | grep -vxF "$TAG" || true)"
          if [[ -n "$OLD" ]]; then
            while IFS= read -r old; do
              echo "Deleting old release: $old"
              gh release delete "$old" -R "$GH_REPO" --yes || true
            done <<< "$OLD"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### RAIDFORCE pack mirror (D-087)"
            echo ""
            echo "- version: \`${VERSION:-?}\`"
            echo "- files: \`${FILE_COUNT:-?}\`"
            echo "- mode: \`${{ steps.index.outputs.mode || '?' }}\`"
            echo "- index sha256: \`${INDEX_SHA:-?}\`"
            echo "- zip sha256: \`${ZIP_SHA:-?}\`"
            echo "- tag: \`${TAG:-?}\`"
            echo "- store: missing=\`${STORE_MISSING:-?}\`, pruned=\`${STORE_PRUNED:-0}\`"
            echo "- remote: \`${REMOTE_VERSION:-none}\` (signed=\`${REMOTE_SIGNED:-?}\`)"
            echo "- dry run: \`${DRY_RUN:-?}\`"
            echo "- skipped: \`${{ steps.check.outputs.skip || 'unknown' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
